name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.0.0"
        required: true

permissions:
  contents: write

env:
  APP_NAME: Clipy2
  SCHEME: Clipy
  TEAM_ID: 9325ZRF44L

jobs:
  release:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/release.keychain-db"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

      - name: Build signed archive
        run: |
          set -euo pipefail
          xcodebuild archive \
            -workspace Clipy.xcworkspace \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -archivePath build/Release.xcarchive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            "CODE_SIGN_IDENTITY=Developer ID Application" \
            "OTHER_CODE_SIGN_FLAGS=--timestamp --options runtime" \
            SKIP_INSTALL=NO

      - name: Notarize and package
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          APP_PATH="build/Release.xcarchive/Products/Applications/$APP_NAME.app"
          ZIP_PATH="build/$APP_NAME-$VERSION.zip"
          DMG_ROOT="build/dmg-root"
          DMG_PATH="build/$APP_NAME-$VERSION.dmg"
          RW_DMG_PATH="build/$APP_NAME-$VERSION-rw.dmg"
          KEY_PATH="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"

          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$KEY_PATH"

          SPARKLE="$APP_PATH/Contents/Frameworks/Sparkle.framework"
          AUTOUPDATE="$SPARKLE/Versions/A/Resources/Autoupdate.app"
          codesign --force --timestamp --options runtime --sign "Developer ID Application" "$AUTOUPDATE/Contents/MacOS/fileop"
          codesign --force --timestamp --options runtime --sign "Developer ID Application" "$AUTOUPDATE"
          codesign --force --timestamp --options runtime --sign "Developer ID Application" "$SPARKLE"
          codesign --force --timestamp --options runtime --preserve-metadata=entitlements --sign "Developer ID Application" "$APP_PATH"

          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          ditto -c -k --keepParent "$APP_PATH" "$ZIP_PATH"
          xcrun notarytool submit "$ZIP_PATH" \
            --key "$KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait
          xcrun stapler staple "$APP_PATH"

          rm -rf "$DMG_ROOT" "$RW_DMG_PATH" "$DMG_PATH"
          mkdir -p "$DMG_ROOT"
          ditto "$APP_PATH" "$DMG_ROOT/$APP_NAME.app"
          ln -s /Applications "$DMG_ROOT/Applications"
          hdiutil create -volname "$APP_NAME" -srcfolder "$DMG_ROOT" -fs HFS+ -fsargs "-c c=64,a=16,e=16" -format UDRW "$RW_DMG_PATH"
          hdiutil convert "$RW_DMG_PATH" -format UDZO -imagekey zlib-level=9 -o "$DMG_PATH"
          codesign --force --timestamp --sign "Developer ID Application" "$DMG_PATH"

          xcrun notarytool submit "$DMG_PATH" \
            --key "$KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait
          xcrun stapler staple "$DMG_PATH"
          shasum -a 256 "$DMG_PATH" > "build/$APP_NAME-$VERSION.dmg.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          DMG_PATH="build/$APP_NAME-$VERSION.dmg"
          SHA_PATH="build/$APP_NAME-$VERSION.dmg.sha256"
          NOTES_PATH="build/release-notes.md"

          cat > "$NOTES_PATH" <<EOF
          Clipy2 $VERSION

          Signed, notarized, and stapled macOS release.

          SHA-256:
          $(cat "$SHA_PATH")
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DMG_PATH" "$SHA_PATH" --clobber
          else
            gh release create "$TAG" "$DMG_PATH" "$SHA_PATH" --title "Clipy2 $VERSION" --notes-file "$NOTES_PATH"
          fi
